# Render Blueprint: Web Service + Postgres
# Dashboard → New → Blueprint → connect repo → use this file, or paste into render.yaml
#
# Python version: pinned via runtime.txt in repo root.
#
# After deploy: set Render env CORS_ORIGINS to your Vercel URL(s), then set
# Vercel VITE_API_URL to this service URL (no trailing slash, no /api suffix).

databases:
  - name: workspace-db
    plan: free
    databaseName: workspace
    user: workspace

services:
  - type: web
    name: workspace-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workspace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Lets your Vercel app (any *.vercel.app) call the API without Blueprint prompts.
      # Tighten later: set CORS_ORIGINS in the dashboard and set this to false.
      - key: CORS_ALLOW_VERCEL
        value: "true"
